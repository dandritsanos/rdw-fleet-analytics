version: 2

sources:
  - name: rdw
    schema: raw
    description: >
      Raw RDW Open Data landed by scripts/extract_rdw.py. All columns are
      strings, exactly as delivered by the Socrata API. Typing happens in
      staging models, not at extraction time.
    loaded_at_field: _extracted_at
    freshness:
      warn_after: {count: 48, period: hour}
      error_after: {count: 168, period: hour}
    tables:
      - name: vehicles
        description: One row per registered vehicle (kenteken).
        columns:
          - name: kenteken
            tests: [unique, not_null]

      - name: fuel
        description: >
          One row per fuel type per vehicle. Vehicles with multiple
          powertrains (hybrids) appear more than once - measured at
          ~19.8% fan-out on the 2010+ passenger-car slice (359,438 fuel
          rows for 300,000 vehicles). NOT unique on kenteken.

      - name: body
        description: >
          One row per body entry per vehicle. ~1.3% of vehicles have no
          body record (296,007/300,000 in the current extract) - joins
          to this table must be LEFT, not INNER.