version: 2

models:
  - name: dim_brand
    description: One row per brand, aggregated from int_vehicle_enriched.
    columns:
      - name: brand_sk
        tests: [unique, not_null]
      - name: brand
        tests: [unique, not_null]
      - name: bev_share_pct
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
      - name: brand_tier
        tests:
          - accepted_values:
              values: ['volume', 'mainstream', 'niche', 'marginal']
              